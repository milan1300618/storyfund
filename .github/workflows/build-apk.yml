name: Build StoryFund APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             git zip unzip             autoconf automake libtool libltdl-dev pkg-config             zlib1g-dev libncurses5-dev libncursesw5-dev             libtinfo5 libffi-dev libssl-dev             cmake gettext autopoint

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer==1.6.0"
          python -m pip install "legacy-cgi" "setuptools<81" "cython==0.29.34"

      - name: Clean all previous build data
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StoryFund-APK
          path: bin/*.apk
          if-no-files-found: error
