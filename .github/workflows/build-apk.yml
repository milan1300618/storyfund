name: Build StoryFund APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            gettext \
            gettext-base \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            wget

      - name: Check autopoint
        run: |
          which autopoint
          autopoint --version

      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install \
            buildozer==1.5.0 \
            Cython==0.29.33 \
            virtualenv

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StoryFund-APK
          path: bin/*.apk
          if-no-files-found: error
